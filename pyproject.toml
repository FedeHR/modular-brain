[project]
name = "tb"
version = "0.0.1"
description = "Minimal Tensor Brain primitives."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "nltk>=3.9.4",
    "numpy>=2.4.5",
    "pillow>=12.2.0",
    "pytest>=9.0.3",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tb"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E741"]  # allow l, I, etc. — we use ℓ-like names

[tool.pytest.ini_options]
testpaths = ["tests"]
